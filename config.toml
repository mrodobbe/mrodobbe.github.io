baseURL = "https://mrodobbe.github.io/"
title = "Maarten Dobbelaere"
theme = "PaperMod"
locale = "en"
publishDir = "docs"
# Only the home page and the publications page: no tags, categories or feeds.
disableKinds = ["taxonomy", "term", "rss"]
# robots.txt lives in static/ so it can block AI crawlers and the PDFs.
enableRobotsTXT = false

[services.googleAnalytics]
  ID = "G-9YTXZQFXW7"

[markup.goldmark.renderer]
  unsafe = true

[params]
  env = "production"
  author = "Maarten Dobbelaere"
  description = "Scientist at the Laboratory for Artificial Chemical Intelligence (LIAC), EPFL, working on AI for chemical synthesis planning."
  images = ["img/portrait-2026.jpg"]
  defaultTheme = "auto"
  hideMeta = true
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = false

  [params.label]
    text = "maarten dobbelaere"

  [params.assets]
    favicon = "img/atom.ico"
    favicon16x16 = "img/atom.ico"
    favicon32x32 = "img/atom.ico"
    apple_touch_icon = "img/portrait-2026.jpg"
    safari_pinned_tab = "img/atom.ico"

# Email is not listed here: the home page builds the address in the browser
# (layouts/_partials/extend_footer.html) so it never appears in plain text.
[[menu.main]]
  name = "Publications"
  url = "/publications/"
  weight = 10

[[menu.main]]
  name = "Press"
  url = "/#press"
  weight = 20

[[menu.main]]
  name = "CV"
  url = "/cv.pdf"
  weight = 30
